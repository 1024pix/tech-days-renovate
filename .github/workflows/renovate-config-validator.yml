name: Renovate config validation

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    name: Validate Renovate config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate Renovate config
        run: npx --yes --package renovate@latest -- renovate-config-validator --strict
